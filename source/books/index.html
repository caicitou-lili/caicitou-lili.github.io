<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#243040; --ink2:#6b7686; --line:#e6e3dc;
  --accent:#b5453c; --accent-soft:#f6e9e7; --ok:#2f7d5f;
  --shadow:0 1px 2px rgba(36,48,64,.06),0 6px 18px rgba(36,48,64,.07);
  --shadow-hover:0 2px 6px rgba(36,48,64,.08),0 14px 34px rgba(36,48,64,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.65;font-size:15px}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---------- 头部 ---------- */
header.site{border-bottom:1px solid var(--line);background:rgba(246,245,241,.92);
  position:sticky;top:0;z-index:50;backdrop-filter:blur(8px)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);padding:12px 0 0}
.back:hover{color:var(--accent)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:22px 0 16px}
h1{font-size:30px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:12px}
h1 .seal{display:inline-grid;place-items:center;width:38px;height:38px;background:var(--accent);color:#fff;
  border-radius:9px;font-size:19px;font-weight:700;box-shadow:0 3px 10px rgba(181,69,60,.28)}
.sub{color:var(--ink2);font-size:13.5px;margin-top:4px}
.sub b{color:var(--accent);font-weight:600}

/* ---------- 工具栏 ---------- */
.toolbar{padding:2px 0 14px;display:flex;flex-direction:column;gap:10px}
.searchrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1;min-width:230px}
.search input{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--line);border-radius:11px;
  background:#fff;font-size:14.5px;color:var(--ink);outline:none;transition:.18s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--ink2)}
select{padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);
  font-size:13.5px;outline:none;cursor:pointer}
select:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chips::-webkit-scrollbar{height:5px}
.chips::-webkit-scrollbar-thumb{background:#d6d2c9;border-radius:4px}
.chip{white-space:nowrap;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;
  font-size:13px;color:var(--ink2);cursor:pointer;transition:.15s;user-select:none}
.chip:hover{border-color:#cfcabf;color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{opacity:.55;font-size:11.5px;margin-left:3px}
.chip.cat.on{background:var(--accent);border-color:var(--accent)}

/* ---------- 网格 ---------- */
.meta{display:flex;justify-content:space-between;align-items:center;padding:4px 0 12px;
  font-size:12.5px;color:var(--ink2);border-bottom:1px dashed var(--line);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:20px 16px;padding-bottom:60px}
.card{cursor:pointer;background:transparent;border:0;text-align:left;font:inherit;display:flex;flex-direction:column}
.coverbox{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#e9e6df;
  box-shadow:var(--shadow);transition:.22s}
.card:hover .coverbox{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
.coverbox img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s}
.coverbox img.ld{opacity:1}
.badge{position:absolute;top:8px;left:8px;background:rgba(20,26,36,.72);color:#fff;font-size:10.5px;
  padding:2px 7px;border-radius:6px;letter-spacing:.5px;backdrop-filter:blur(3px)}
.badge.set{top:auto;bottom:8px;left:8px;background:rgba(181,69,60,.85)}
.ct{margin-top:9px;font-size:13.8px;font-weight:600;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ca{margin-top:3px;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:70px 0;text-align:center;color:var(--ink2)}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}

/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(24,32,44,.5);z-index:100;display:none;
  align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.mask.show{display:flex}
.modal{background:#fff;border-radius:16px;max-width:720px;width:100%;max-height:88vh;overflow:auto;
  box-shadow:0 24px 60px rgba(0,0,0,.25);animation:pop .22s ease}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.mbody{display:flex;gap:22px;padding:26px}
.mcover{flex:0 0 170px;max-width:170px}
.mcover img{width:100%;border-radius:10px;box-shadow:var(--shadow-hover);display:block}
.minfo{flex:1;min-width:0}
.mclose{position:sticky;top:0;float:right;margin:12px 12px 0 0;width:32px;height:32px;border-radius:50%;
  border:0;background:#f0eee9;color:var(--ink2);font-size:17px;cursor:pointer;line-height:1;z-index:2}
.mclose:hover{background:var(--accent);color:#fff}
.mtitle{font-size:21px;font-weight:700;line-height:1.4;padding-right:34px}
.mauthor{color:var(--accent);font-size:14px;margin-top:6px;font-weight:600}
.mtags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.tag{font-size:11.5px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.g{background:#eef3ef;color:var(--ok)}
.mdesc{margin-top:12px;font-size:14px;color:#3d4a5c;line-height:1.8;white-space:pre-wrap}
.mdesc.none{color:#a9b0ba;font-size:13px}
.mfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:18px;
  padding-top:16px;border-top:1px dashed var(--line)}
.fact .k{font-size:11.5px;color:var(--ink2)}
.fact .v{font-size:13px;font-weight:600;margin-top:2px}
.mnote{margin-top:16px;font-size:12px;color:#a9b0ba;background:#f7f6f2;border-radius:9px;padding:9px 12px}
footer{border-top:1px solid var(--line);padding:22px 0 34px;color:var(--ink2);font-size:12.5px;text-align:center}
footer a{color:var(--accent)}
@media(max-width:640px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:16px 12px}
  .mbody{flex-direction:column;padding:20px}
  .mcover{flex:none;width:140px;margin:0 auto}
  h1{font-size:24px}
}
</style>

","title":"大实话：历史与现在","author":"张鸣","cats":["历史"],"subjects":["历史"],"format":"EPUB","size":164160,"desc":"从历史看现在，因现在想起历史 继《历史的坏脾气》《历史的底稿》之后，张鸣教授推出崭新历史观察与时政评论合集，知识分子要有说大实话的胆量，人们要有说大实话的权利，社会要有说大实话的自由。 似乎不再“另类”，依然“不合时宜”！ 集体下棋与民主制度：在威权体制下，恰是才高者容易犯错误，而且犯了错误，就难以纠正，一条道走到黑。当年的苏联人看我们的“大跃进”时的政治，说当时的中国就像一辆被一个酒醉的司机开上了悬崖边上山路的公共汽车，但是却没有乘客能够制止这个司机。 韩寒的山寨：作协也断然不可能因为韩寒的山寨，韩寒的嘲笑，有什么损伤，毕竟，那里的权势太大，好处太多，纵然出一万个丑闻，依然会门庭若市，这个世界上，闻着味就跃跃的，不止有动物。 世袭制的魅影：没人敢说，官宦子弟就一定没本事，更没人敢说，官宦子弟就必定是纨袴的代名词，从古至今，有出息、有作为的官宦子弟有的是。但是，为官者，尤其是为高官者一定要注意，千万不能把平民上升的路都给堵了。 张鸣教授历史散文系列，晚近中国的另类观察。","cover":"5cf70842bb49.webp","publisher":"epub掌上书苑","is_set":false},{"id":"af47523fc272","title":"大汉帝国","author":"萧然","cats":["历史"],"subjects":[],"format":"EPUB","size":12049452,"desc":"","cover":"af47523fc272.webp","publisher":"上海社会科学院出版社","is_set":false},{"id":"2357aacf29a0","title":"张学良口述历史","author":"唐德刚","cats":["历史"],"subjects":[],"format":"EPUB","size":254110,"desc":"回首百年，张学良是改变中国历史进程的人物之一。本性最适合做一个声色犬马的公子哥儿，可现实偏要压他一肩的戎马战事和国恨家仇，更遇上“九一八事变”，不抵抗的罪名令他几成民族公敌；西安事变促成了抗日统一战线，他自己却从此被幽禁半个世纪，也因此赢得了世人的敬重。他无限感慨地说：“我的事情是到36岁，以后就没有了；从21岁到36岁，这就是我的生命。”国内虽然已经出版过很多有关张氏生平的书，但少见真正有分量有价值的。本书由史学名家唐德刚先生担纲完成，以张氏自述为主体，以唐德刚论张学良的数万文字为辅，正好地弥补了以往各种图书的错谬与不足。更兼唐的论说精辟而有洞明世事人情的味道。一边是研究对象的“自白”，一边是研究者的“审视”，两相对照着看，历史变得更为真切、真实而生动。 张氏的口述，随兴而谈，随意而至，流于细碎，却趣味盎然，更往往于不经意间，好比在历史的铁屋子里，开出一片极窄的天窗，露出来的。是遍寻史书也不能得的真实。 在张氏印象里，张作霖吃饭，四菜没汤；张作相节俭，一个鸡蛋分两餐；叶公超好色，顾维钧风流；蒋介石只剩下了个派头；汪精卫、陈璧君的奇妙夫妻档；胡汉民发牢骚；孙中山一句话论东北局势；郭松龄宁折不弯，吴佩孚浪得虚名，阎锡山见风使舵、张宗昌能战、孙传芳不甘寂寞，以及溥仪溥杰，没落皇室家族的种种…… 在五光十色的中国近代史中，在百余年当政者的公私生活和政治成败的记录上，最多彩多姿的领袖人物“少帅”张学良将军，应该是独占鳌头了。他那带有浓厚传奇性和高度戏剧化的一生，在民国史上老中青三代的领袖中，真没有第二人可与其相比。尤其是他政治生涯中最后一记撒手锏的西安事变，简直扭转了中国历史，也改写了世界历史。","cover":"2357aacf29a0.webp","publisher":"epub掌上书苑","is_set":false},{"id":"4d513576cee7","title":"思考与选择(1956-1957)","author":"佚名","cats":["历史"],"subjects":[],"format":"PDF","size":41423755,"desc":"","cover":"4d513576cee7.webp","publisher":"","is_set":false},{"id":"5d7932062138","title":"明朝那些事儿（图文增补版）","author":"当年明月","cats":["历史","小说"],"subjects":[],"format":"AZW3","size":41489925,"desc":"","cover":"5d7932062138.webp","publisher":"","is_set":false},{"id":"5fe2431b013c","title":"易中天品三国","author":"易中天","cats":["历史"],"subjects":["CNTY:CHINA","ZDC:LSDL"],"format":"AZW3","size":1148543,"desc":"我们总是习惯于把王朝的兴衰、事业的成败、历史的更替和事情的对错都归结为个人的原因，归结为某个领袖人物和主导人物个人品质的优劣好坏。与此同时，历史人物也都按照一种简单的善恶二元化论而无一例外地脸谱化了，中国历史则变成了一个大戏台。但我们从来就不知道舞台上为什么会有那么多白脸和白鼻子，也不知道红脸和黑脸的什么时候才能出现，因为我们不知道编剧和导演是谁。我们只能寄希望于运气和等待，却不肯承认每一次“善报”，往往也差不多意味着下一次“恶运”的来临。 从天下大乱到诸侯割据；从三国鼎立到重归统一；这是一个英雄辈出的时代；这是一段扑朔迷离的历史；这是一些引人入胜的故事；这是一个津津乐道的话题；正史记录，野史传说，戏剧编排，小说演义；不同时期有不同的评点；不同作品有不同的描述；是非真假众说纷纭；成败得失疑窦丛生；厦门大学教授易中天先生站在平民立场，通过现代视角，运用三维结构；以故事说人物，以人物说历史，以历史说文化，以文化说人生；一家之言品三国。 易中天，1947年生，湖南长沙人，1981年毕业于武汉大学，获文学硕士学位并留校任教，现任厦门大学人文学院教授，长期从事文学、艺术、美学、心理学、人类学、历史学等多学科和跨学科研究，著有《〈文心雕龙〉美学思想论稿》、《艺术人类学》、《黄与蓝的交响——中西美学比较论》（与邓晓芒合作）等著作。近年撰写出版了“易中天随笔体学术著作·中国文化系列”四种：《闲话中国人》、《中国的男人和女人》、《读城记》和《品人录》以及《帝国的惆怅》等。","cover":"5fe2431b013c.webp","publisher":"epub掌上书苑","is_set":false},{"id":"8fdc57fd5589","title":"极简人类史：从宇宙大爆炸到21世纪","author":"[美]大卫·克里斯蒂安","cats":["历史"],"subjects":[],"format":"EPUB","size":9351294,"desc":"","cover":"8fdc57fd5589.webp","publisher":"中信出版社","is_set":false},{"id":"5b4552a55490","title":"三国那些人那些事（套装5册）","author":"陈瓷","cats":["合集"],"subjects":["三国"],"format":"AZW3","size":4086337,"desc":"收录：三国那些人那些事·魏卷 by 陈瓷 著 三国那些人那些事·蜀卷 by 陈瓷 著 三国那些人那些事·吴卷 by 陈瓷 著 三国那些人那些事·霸主卷 by 陈瓷 三国那些人那些事·红颜卷 by 陈瓷","cover":"5b4552a55490.webp","publisher":"","is_set":true},{"id":"30cabec7b6a9","title":"周易江湖","author":"佚名","cats":["周易"],"subjects":[],"format":"PDF","size":7972069,"desc":"","cover":"30cabec7b6a9.webp","publisher":"","is_set":false},{"id":"56cfa8bdf20b","title":"易经的智慧1","author":"曾仕强","cats":["周易"],"subjects":["周易"],"format":"EPUB","size":2804306,"desc":"","cover":"56cfa8bdf20b.webp","publisher":"葫芦出版社","is_set":false},{"id":"cd95be143f8d","title":"《资本论》哲学的新解读","author":"鲍金","cats":["哲学"],"subjects":[],"format":"AZW3","size":456691,"desc":"","cover":"cd95be143f8d.webp","publisher":"中国人民大学出版社","is_set":false},{"id":"607a <script>
const BOOKS = JSON.parse(document.getElementById('books-data').textContent);
const state = {q:'', cat:'', fmt:'', sort:'def'};

const $ = s => document.querySelector(s);
const grid = $('#grid'), emptyEl = $('#empty');

function fmtSize(n){
  if(!n) return '—';
  if(n > 1048576) return (n/1048576).toFixed(1)+' MB';
  return Math.max(1, Math.round(n/1024))+' KB';
}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

/* 分类 chips */
const catCount = {};
BOOKS.forEach(b => (b.cats.length?b.cats:['未分类']).forEach(c => catCount[c]=(catCount[c]||0)+1));
const cats = Object.entries(catCount).sort((a,b)=>b[1]-a[1]);
const chips = $('#cats');
function chip(label, val, n, cls){
  const b=document.createElement('button');
  b.className='chip '+(cls||'');
  b.innerHTML = esc(label)+'<span class="n">'+n+'</span>';
  b.onclick=()=>{state.cat = (state.cat===val)?'':val; paint(); render();};
  b.dataset.v=val;
  chips.appendChild(b);
}
chip('全部','', BOOKS.length,'cat');
cats.forEach(([c,n])=>chip(c,c,n,'cat'));

/* 格式 */
const fmts=[...new Set(BOOKS.map(b=>b.format))].sort();
const fmtSel=$('#fmt');
fmts.forEach(f=>{const o=document.createElement('option');o.value=f;o.textContent=f;fmtSel.appendChild(o);});

$('#q').addEventListener('input', e=>{state.q=e.target.value.trim().toLowerCase(); render();});
$('#fmt').addEventListener('change', e=>{state.fmt=e.target.value; render();});
$('#sort').addEventListener('change', e=>{state.sort=e.target.value; render();});
document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement!==$('#q')){e.preventDefault();$('#q').focus();}
  if(e.key==='Escape') close();
});

function paint(){
  chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c.dataset.v===state.cat));
}

function filtered(){
  let out = BOOKS.filter(b=>{
    if(state.cat && !b.cats.includes(state.cat)) return false;
    if(state.fmt && b.format!==state.fmt) return false;
    if(state.q){
      const hay=(b.title+' '+(b.author||'')+' '+(b.publisher||'')+' '+b.cats.join(' ')).toLowerCase();
      if(!hay.includes(state.q)) return false;
    }
    return true;
  });
  const s=state.sort;
  if(s==='title') out.sort((a,b)=>a.title.localeCompare(b.title,'zh'));
  else if(s==='author') out.sort((a,b)=>(a.author||'').localeCompare(b.author||'','zh'));
  else if(s==='size') out.sort((a,b)=>b.size-a.size);
  return out;
}

const io = new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){ const img=e.target; img.src=img.dataset.src; img.classList.add('ld'); io.unobserve(img);} });
},{rootMargin:'260px'});

function render(){
  const list = filtered();
  $('#count').textContent = '共 '+list.length+' 册' + (state.cat?(' · '+state.cat):'');
  grid.innerHTML='';
  emptyEl.style.display = list.length? 'none':'block';
  const frag = document.createDocumentFragment();
  list.forEach(b=>{
    const el=document.createElement('button');
    el.className='card'; el.type='button';
    el.innerHTML =
      '<div class="coverbox">'+
        '<img alt="'+esc(b.title)+'" loading="lazy" data-src="covers/'+b.cover+'">'+
        '<span class="badge">'+esc(b.format)+'</span>'+
        (b.is_set?'<span class="badge set">套装</span>':'')+
      '</div>'+
      '<div class="ct">'+esc(b.title)+'</div>'+
      '<div class="ca">'+esc(b.author||'佚名')+'</div>';
    el.onclick=()=>open(b);
    frag.appendChild(el);
  });
  grid.appendChild(frag);
  grid.querySelectorAll('img[data-src]').forEach(img=>io.observe(img));
}

function open(b){
  const m=$('#modal');
  m.innerHTML =
    '<button class="mclose" id="mx" aria-label="关闭">✕</button>'+
    '<div class="mbody">'+
      '<div class="mcover"><img src="covers/'+b.cover+'" alt="'+esc(b.title)+'"></div>'+
      '<div class="minfo">'+
        '<div class="mtitle">'+esc(b.title)+'</div>'+
        '<div class="mauthor">'+esc(b.author||'佚名')+'</div>'+
        '<div class="mtags">'+
          b.cats.map(c=>'<span class="tag">'+esc(c)+'</span>').join('')+
          '<span class="tag g">'+esc(b.format)+'</span>'+
          (b.is_set?'<span class="tag g">套装</span>':'')+
        '</div>'+
        (b.desc? '<div class="mdesc">'+esc(b.desc)+'</div>'
               : '<div class="mdesc none">暂无简介。这本书的元数据比较简略，等你读完来补一条？</div>')+
        '<div class="mfacts">'+
          '<div class="fact"><div class="k">体积</div><div class="v">'+fmtSize(b.size)+'</div></div>'+
          (b.publisher?'<div class="fact"><div class="k">出版</div><div class="v">'+esc(b.publisher)+'</div></div>':'')+
          (b.subjects&&b.subjects.length?'<div class="fact"><div class="k">主题</div><div class="v">'+esc(b.subjects.slice(0,3).join('、'))+'</div></div>':'')+
        '</div>'+
        '<div class="mnote">本页仅收录书目信息，用于个人藏书索引，不提供文件下载。</div>'+
      '</div>'+
    '</div>';
  $('#mask').classList.add('show');
  $('#mx').onclick=close;
  document.body.style.overflow='hidden';
}
function close(){
  $('#mask').classList.remove('show');
  document.body.style.overflow='';
}
$('#mask').addEventListener('click', e=>{ if(e.target.id==='mask') close(); });

paint();
render();
</script>
